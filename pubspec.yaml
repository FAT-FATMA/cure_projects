name: cure
description: "A Flutter healthcare prototype for local medication tracking."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.1
  shared_preferences: ^2.5.3
  firebase_auth: ^5.5.4
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  http: ^1.4.0
  intl: ^0.18.1
  path: ^1.9.1
  flutter_local_notifications: ^18.0.1
  android_alarm_manager_plus: ^4.0.7
  timezone: ^0.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/Logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assets/Logo.png"
  

flutter:
  uses-material-design: true
  assets:
    - lib/assets/
    - lib/assets/icons/